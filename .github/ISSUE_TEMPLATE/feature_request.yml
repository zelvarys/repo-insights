name: Feature request
description: Suggest an improvement or new capability for repo-insights
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Explain the problem first, then the proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you have considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication
        - Repository scanning
        - Dashboard
        - Activity
        - Dependencies
        - Workflows
        - Structure
        - Tool adoption
        - Settings
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples, or links that clarify the request.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
